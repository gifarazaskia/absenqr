
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Absensi QR</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #0f766e;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #e2e8f0;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .loading {
      background: #fef3c7 !important;
      color: #92400e;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .small {
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>ABSENSI QR CODE</h2>

  <p>Arahkan kamera ke QR Code siswa atau guru.</p>

  <div id="reader"></div>

  <div id="status">Menghubungkan kamera...</div>

  <button id="restartBtn" onclick="restartCamera()" disabled>
    BUKA KAMERA KEMBALI
  </button>

  <div class="small">
    Sistem Absensi Digital
  </div>
</div>

<script>
  // =====================================
  // PENGATURAN URL APPS SCRIPT
  // =====================================

  const API_URL = 'MASUKKAN_URL_WEB_APP_APPS_SCRIPT_DI_SINI';

  // =====================================
  // VARIABEL
  // =====================================

  let scanner = null;
  let scanLock = false;
  let requestTimer = null;

  const statusBox = document.getElementById('status');
  const restartBtn = document.getElementById('restartBtn');

  // Token dikirim dari aplikasi utama melalui URL fragment.
  const token = new URLSearchParams(
    window.location.hash.substring(1)
  ).get('token');

  // =====================================
  // STATUS
  // =====================================

  function showStatus(message, type = '') {
    statusBox.textContent = message;
    statusBox.className = type;
  }

  // =====================================
  // VALIDASI PENGATURAN
  // =====================================

  function validateSettings() {
    if (
      !API_URL.startsWith('https://script.google.com/macros/s/') ||
      !API_URL.endsWith('/exec')
    ) {
      showStatus(
        'URL Apps Script belum diatur dengan benar pada kode GitHub.',
        'error'
      );
      return false;
    }

    if (!token) {
      showStatus(
        'Token login tidak ditemukan. Silakan buka kamera dari aplikasi absensi.',
        'error'
      );
      return false;
    }

    return true;
  }

  // =====================================
  // KIRIM HASIL SCAN KE APPS SCRIPT
  // =====================================

  function sendScan(qrText) {
    return new Promise((resolve, reject) => {
      const callbackName = 'qrScanCallback';

      let script = document.createElement('script');
      let finished = false;

      function cleanup() {
        if (requestTimer) {
          clearTimeout(requestTimer);
          requestTimer = null;
        }

        delete window[callbackName];

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      function finish(error, result) {
        if (finished) return;

        finished = true;
        cleanup();

        if (error) {
          reject(error);
        } else {
          resolve(result);
        }
      }

      window[callbackName] = function(result) {
        finish(null, result);
      };

      const params = new URLSearchParams({
        action: 'scan',
        token: token,
        qr: qrText,
        callback: callbackName
      });

      script.src = API_URL + '?' + params.toString();

      script.onerror = function() {
        finish(new Error(
          'Tidak dapat menghubungi Google Apps Script. Periksa URL dan deployment.'
        ));
      };

      requestTimer = setTimeout(() => {
        finish(new Error(
          'Waktu koneksi habis. Periksa URL Apps Script dan deployment.'
        ));
      }, 25000);

      document.body.appendChild(script);
    });
  }

  // =====================================
  // PROSES KETIKA QR TERBACA
  // =====================================

  async function onScanSuccess(decodedText) {
    if (scanLock) return;

    scanLock = true;
    restartBtn.disabled = true;

    showStatus(
      'QR terbaca. Mengirim data ke Google Spreadsheet...',
      'loading'
    );

    try {
      const result = await sendScan(decodedText);

      if (result && result.success === true) {
        showStatus(
          result.message || 'ABSENSI BERHASIL DISIMPAN!',
          'success'
        );
      } else {
        showStatus(
          (result && result.message) ||
          'Absensi gagal disimpan. Periksa data QR dan akun.',
          'error'
        );
      }

    } catch (error) {
      showStatus(
        'KONEKSI GAGAL! ' + error.message,
        'error'
      );
    }

    // Jeda agar QR yang sama tidak terkirim berulang kali.
    setTimeout(() => {
      scanLock = false;
      restartBtn.disabled = false;
    }, 2500);
  }

  // =====================================
  // MEMBUKA KAMERA
  // =====================================

  async function startCamera() {
    if (!validateSettings()) return;

    showStatus('Memulai kamera...', 'loading');

    restartBtn.disabled = true;

    try {
      if (!scanner) {
        scanner = new Html5Qrcode('reader');
      }

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          aspectRatio: 1
        },
        onScanSuccess,
        function() {}
      );

      showStatus(
        'Kamera aktif. Silakan pindai QR Code.',
        'success'
      );

      restartBtn.disabled = false;

    } catch (error) {
      showStatus(
        'Kamera gagal dibuka. Izinkan akses kamera dan gunakan HTTPS.',
        'error'
      );

      restartBtn.disabled = false;
    }
  }

  // =====================================
  // BUKA KAMERA KEMBALI
  // =====================================

  async function restartCamera() {
    try {
      if (scanner && scanner.isScanning) {
        await scanner.stop();
      }
    } catch (error) {}

    scanLock = false;
    await startCamera();
  }

  // =====================================
  // JALANKAN APLIKASI
  // =====================================

  window.addEventListener('load', function() {
    startCamera();
  });

</script>

</body>
</html>
