
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemindai QR Absensi Sekolah</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1748d0, #07152e);
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 22px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 15px 45px #0004;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    p {
      color: #64748b;
      text-align: center;
      font-size: 14px;
    }

    .status {
      padding: 12px;
      margin: 15px 0;
      border-radius: 9px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 13px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    iframe {
      width: 100%;
      height: 720px;
      border: 0;
      border-radius: 12px;
      background: white;
    }

    @media(max-width: 600px) {
      body {
        padding: 0;
        display: block;
      }

      .container {
        min-height: 100vh;
        max-width: none;
        padding: 15px;
        border-radius: 0;
      }

      iframe {
        height: 78vh;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Absensi QR Sekolah</h2>
  <p>Pemindai kamera absensi siswa dan guru.</p>

  <div id="status" class="status">
    Menghubungkan ke aplikasi absensi...
  </div>

  <iframe
    id="scannerFrame"
    title="Pemindai QR Absensi"
    allow="camera; fullscreen">
  </iframe>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);

  const appUrl = params.get('app');
  const token = params.get('token');

  const status = document.getElementById('status');
  const frame = document.getElementById('scannerFrame');

  if (!appUrl || !token) {
    status.textContent =
      'Sesi tidak ditemukan. Silakan buka pemindai melalui aplikasi absensi.';
    status.classList.add('error');
    return;
  }

  try {
    const url = new URL(appUrl);

    if (url.protocol !== 'https:') {
      throw new Error('Alamat aplikasi harus menggunakan HTTPS.');
    }

    url.searchParams.set('page', 'scanner');
    url.searchParams.set('token', token);

    frame.src = url.toString();

    frame.onload = function() {
      status.textContent =
        'Aplikasi terhubung. Silakan mulai kamera.';
    };

  } catch (error) {
    status.textContent = error.message;
    status.classList.add('error');
  }
})();
</script>

</body>
</html>
