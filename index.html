
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f1f5f9;
  color: #172033;
  min-height: 100vh;
}

.container {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  background: white;
  padding: 20px;
}

.header {
  background: #14532d;
  color: white;
  padding: 22px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 22px;
}

.header h2 {
  font-size: 22px;
  margin-bottom: 7px;
}

.header p {
  font-size: 13px;
}

.info {
  text-align: center;
  margin-bottom: 18px;
}

.info h3 {
  margin-bottom: 7px;
}

.info p {
  font-size: 13px;
  color: #64748b;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
  background: #111827;
}

#reader video {
  object-fit: cover !important;
}

.result {
  display: none;
  margin-top: 18px;
  padding: 17px;
  border-radius: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.result strong {
  display: block;
  font-size: 17px;
  margin-bottom: 5px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

.btn-green {
  background: #15803d;
  color: white;
}

.btn-gray {
  background: #e2e8f0;
  color: #172033;
}

.btn-red {
  background: #dc2626;
  color: white;
}

.status {
  text-align: center;
  margin-top: 15px;
  font-size: 13px;
  color: #64748b;
  line-height: 1.5;
}

.hidden {
  display: none;
}

.footer {
  text-align: center;
  color: #94a3b8;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>ABSENSI QR CODE</h2>
    <p>Scanner Kehadiran Siswa dan Guru</p>
  </div>

  <div class="info">
    <h3>PEMINDAIAN QR CODE</h3>
    <p>Arahkan kamera belakang HP ke QR Code.</p>
  </div>

  <div id="reader"></div>

  <div id="result" class="result"></div>

  <button
    id="restartButton"
    class="btn-green hidden"
    onclick="restartScanner()">
    SCAN BERIKUTNYA
  </button>

  <button
    id="stopButton"
    class="btn-red"
    onclick="stopScanner()">
    TUTUP KAMERA
  </button>

  <div id="status" class="status">
    Memeriksa koneksi aplikasi...
  </div>

  <div class="footer">
    Sistem Absensi Sekolah
  </div>

</div>

<!-- PENGHUBUNG KE APPS SCRIPT -->
<iframe
  name="apiFrame"
  id="apiFrame"
  style="display:none">
</iframe>

<form
  id="apiForm"
  method="POST"
  target="apiFrame"
  style="display:none">

  <input
    type="hidden"
    name="payload"
    id="apiPayload">

</form>

<script>

/****************************************************
 * PENGATURAN
 ****************************************************/

// Ganti dengan URL deployment Web App Apps Script.
const API_URL =
  'MASUKKAN_URL_WEB_APP_APPS_SCRIPT/exec';

let token = '';
let scanner = null;
let scannerRunning = false;
let scanLocked = false;
let pendingRequest = null;


/****************************************************
 * MEMBACA TOKEN LOGIN
 ****************************************************/

function getToken() {
  const params = new URLSearchParams(
    window.location.hash.substring(1)
  );

  return params.get('token') || '';
}


/****************************************************
 * INISIALISASI
 ****************************************************/

window.addEventListener('load', async function() {

  token = getToken();

  // Hilangkan token dari address bar setelah dibaca.
  history.replaceState(
    null,
    '',
    window.location.pathname + window.location.search
  );

  if (!token) {
    showResult(
      'Token login tidak ditemukan. Silakan buka scanner dari aplikasi utama.',
      false
    );

    document.getElementById('status').textContent =
      'Akses scanner ditolak.';

    document.getElementById('stopButton').classList.add('hidden');
    return;
  }

  if (!window.isSecureContext) {
    showResult(
      'Scanner harus dibuka menggunakan HTTPS.',
      false
    );
    return;
  }

  await startScanner();
});


/****************************************************
 * MEMULAI KAMERA
 ****************************************************/

async function startScanner() {

  if (!token) return;

  try {

    document.getElementById('status').textContent =
      'Meminta izin kamera...';

    document.getElementById('result').className = 'result';

    document.getElementById('restartButton')
      .classList.add('hidden');

    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: function(width, height) {
          const size = Math.floor(
            Math.min(width, height) * 0.75
          );

          return {
            width: size,
            height: size
          };
        },
        aspectRatio: 1
      },
      async function(decodedText) {
        await onScan(decodedText);
      },
      function() {
        // Mengabaikan frame yang belum terbaca.
      }
    );

    scannerRunning = true;
    scanLocked = false;

    document.getElementById('status').textContent =
      'Kamera aktif. Silakan scan QR Code.';

  } catch (error) {

    scannerRunning = false;

    showResult(
      'Kamera tidak dapat dibuka: ' + error.message,
      false
    );

    document.getElementById('status').textContent =
      'Periksa izin kamera pada browser HP.';
  }
}


/****************************************************
 * HASIL SCAN
 ****************************************************/

async function onScan(decodedText) {

  if (scanLocked) return;

  scanLocked = true;

  const qr = String(decodedText).trim();

  document.getElementById('status').textContent =
    'QR Code terbaca. Mengirim data...';

  await stopCameraOnly();

  try {

    const response = await sendToAppsScript(qr);

    if (
      response &&
      response.success &&
      response.result &&
      response.result.success
    ) {

      const record = response.result.record || {};

      showResult(
        '<strong>ABSENSI BERHASIL!</strong>' +
        'Nama: ' + safe(record.Nama) + '<br>' +
        'ID: ' + safe(record['ID/NIS/NIP']) + '<br>' +
        'Peran: ' + safe(record.Peran) + '<br>' +
        'Kelas/Jabatan: ' + safe(record['Kelas / Jabatan']) + '<br>' +
        'Tanggal: ' + safe(record.Tanggal) + '<br>' +
        'Waktu: ' + safe(record['Waktu Masuk']) + '<br>' +
        'Status: ' + safe(record.Status),
        true
      );

      document.getElementById('status').textContent =
        'Data berhasil disimpan ke Google Spreadsheet.';

    } else {

      const message =
        response && response.result
          ? response.result.message
          : 'Gagal menyimpan absensi.';

      showResult(
        '<strong>ABSENSI GAGAL!</strong>' + safe(message),
        false
      );

      document.getElementById('status').textContent =
        'Periksa QR Code atau coba kembali.';
    }

  } catch (error) {

    showResult(
      '<strong>KONEKSI GAGAL!</strong>' + safe(error.message),
      false
    );

    document.getElementById('status').textContent =
      'Tidak berhasil menghubungi server.';
  }

  document.getElementById('restartButton')
    .classList.remove('hidden');
}


/****************************************************
 * KIRIM DATA KE APPS SCRIPT
 ****************************************************/

function sendToAppsScript(qr) {

  return new Promise(function(resolve, reject) {

    if (pendingRequest) {
      reject(new Error('Permintaan sebelumnya belum selesai.'));
      return;
    }

    const requestId =
      Date.now().toString() +
      Math.random().toString(36).substring(2);

    pendingRequest = {
      requestId: requestId,
      resolve: resolve,
      reject: reject
    };

    const payload = {
      action: 'scan',
      requestId: requestId,
      token: token,
      qr: qr
    };

    document.getElementById('apiPayload').value =
      JSON.stringify(payload);

    document.getElementById('apiForm').action =
      API_URL;

    document.getElementById('apiForm').submit();

    setTimeout(function() {

      if (
        pendingRequest &&
        pendingRequest.requestId === requestId
      ) {
        pendingRequest = null;

        reject(new Error(
          'Server tidak memberikan respons dalam 30 detik.'
        ));
      }

    }, 30000);

  });
}


/****************************************************
 * MENERIMA RESPONS APPS SCRIPT
 ****************************************************/

window.addEventListener('message', function(event) {

  const frame = document.getElementById('apiFrame');

  if (event.source !== frame.contentWindow) return;

  const data = event.data;

  if (
    !data ||
    !pendingRequest ||
    data.requestId !== pendingRequest.requestId
  ) {
    return;
  }

  const request = pendingRequest;
  pendingRequest = null;

  if (data.success) {
    request.resolve(data);
  } else {
    request.resolve(data);
  }
});


/****************************************************
 * MENAMPILKAN HASIL
 ****************************************************/

function showResult(message, success) {

  const element = document.getElementById('result');

  element.className = success
    ? 'result success'
    : 'result error';

  element.innerHTML = message;
}


/****************************************************
 * SCAN BERIKUTNYA
 ****************************************************/

async function restartScanner() {

  document.getElementById('result').className = 'result';

  document.getElementById('restartButton')
    .classList.add('hidden');

  scanLocked = false;

  await startScanner();
}


/****************************************************
 * STOP KAMERA
 ****************************************************/

async function stopCameraOnly() {

  if (scanner && scannerRunning) {
    try {
      await scanner.stop();
    } catch (error) {}
  }

  scannerRunning = false;
}


async function stopScanner() {

  await stopCameraOnly();

  document.getElementById('status').textContent =
    'Kamera telah ditutup.';

  document.getElementById('stopButton')
    .classList.add('hidden');

  document.getElementById('restartButton')
    .classList.remove('hidden');
}


/****************************************************
 * AMANKAN TEKS HASIL SCAN
 ****************************************************/

function safe(value) {

  return String(value || '').replace(
    /[&<>"']/g,
    function(char) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char];
    }
  );
}

</script>

</body>
</html>
