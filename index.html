
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Scanner Absensi QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f1f5f9;
  color: #172033;
}

.container {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  background: #fff;
  padding: 20px;
}

.header {
  padding: 23px 15px;
  border-radius: 15px;
  background: #14213d;
  color: white;
  text-align: center;
  margin-bottom: 22px;
}

.header h2 {
  font-size: 22px;
  margin-bottom: 7px;
}

.header p {
  font-size: 12px;
  opacity: .85;
}

.info {
  text-align: center;
  margin-bottom: 18px;
}

.info h3 {
  font-size: 18px;
  margin-bottom: 7px;
}

.info p {
  font-size: 13px;
  color: #64748b;
  line-height: 1.5;
}

#reader {
  width: 100%;
  min-height: 230px;
  overflow: hidden;
  border: 1px solid #e2e8f0;
  border-radius: 15px;
  background: #111827;
}

#reader video {
  width: 100%;
  object-fit: cover;
}

.result {
  display: none;
  margin-top: 17px;
  padding: 17px;
  border-radius: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  font-size: 13px;
}

.result.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.result.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.result strong {
  display: block;
  font-size: 17px;
  margin-bottom: 5px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.btn-green {
  background: #15803d;
  color: white;
}

.btn-gray {
  background: #e2e8f0;
  color: #172033;
}

.btn-red {
  background: #dc2626;
  color: white;
}

.status {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #64748b;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.footer {
  text-align: center;
  color: #94a3b8;
  font-size: 11px;
  margin-top: 25px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>ABSENSI QR CODE</h2>
    <p>Scanner Kehadiran Siswa dan Guru</p>
  </div>

  <div class="info">
    <h3>PEMINDAIAN QR CODE</h3>
    <p>
      Arahkan kamera belakang HP ke QR Code
      siswa atau guru.
    </p>
  </div>

  <div id="reader"></div>

  <div id="result" class="result"></div>

  <button
    id="nextButton"
    class="btn-green hidden"
    onclick="restartScanner()">
    SCAN BERIKUTNYA
  </button>

  <button
    id="stopButton"
    class="btn-red"
    onclick="stopScanner()">
    TUTUP KAMERA
  </button>

  <button
    id="backButton"
    class="btn-gray"
    onclick="backToMain()">
    KEMBALI KE APLIKASI
  </button>

  <div id="status" class="status">
    Memeriksa sesi aplikasi...
  </div>

  <div class="footer">
    Sistem Absensi Sekolah
  </div>

</div>

<!-- IFRAME PENGHUBUNG APPS SCRIPT -->
<iframe
  id="apiFrame"
  name="apiFrame"
  style="display:none">
</iframe>

<form
  id="apiForm"
  method="POST"
  target="apiFrame"
  style="display:none">

  <input
    type="hidden"
    name="payload"
    id="apiPayload">

</form>

<script>

/************************************************
 * PENGATURAN KONEKSI
 ************************************************/

/*
 * GANTI DENGAN URL WEB APP APPS SCRIPT
 * URL HARUS BERAKHIR DENGAN /exec
 */

const API_URL =
  'MASUKKAN_URL_WEB_APP_APPS_SCRIPT_DI_SINI';


/************************************************
 * KONFIGURASI GITHUB
 ************************************************/

const MAIN_URL =
  'https://gifarazaskia.github.io/absenqr/';


/************************************************
 * VARIABEL
 ************************************************/

let appToken = '';
let scanner = null;
let scannerRunning = false;
let scanLocked = false;
let pendingRequest = null;


/************************************************
 * MEMBACA TOKEN DARI APLIKASI UTAMA
 ************************************************/

function readToken() {
  const params = new URLSearchParams(
    window.location.hash.substring(1)
  );

  return params.get('token') || '';
}


/************************************************
 * MULAI APLIKASI
 ************************************************/

window.addEventListener('load', async function() {

  appToken = readToken();

  // Menghapus token dari address bar.
  history.replaceState(
    null,
    '',
    window.location.pathname + window.location.search
  );

  if (!appToken) {
    showResult(
      'Sesi tidak ditemukan. Silakan login melalui aplikasi utama, kemudian buka scanner kembali.',
      false
    );

    $('status').textContent =
      'Akses scanner memerlukan sesi aplikasi utama.';

    $('stopButton').classList.add('hidden');

    return;
  }

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices
  ) {
    showResult(
      'Browser tidak mendukung akses kamera. Buka melalui HTTPS.',
      false
    );
    return;
  }

  if (
    API_URL.indexOf(
      'https://script.google.com/macros/s/'
    ) !== 0 ||
    !API_URL.endsWith('/exec')
  ) {
    showResult(
      'URL Apps Script belum diatur dengan benar pada kode GitHub.',
      false
    );

    $('status').textContent =
      'Periksa konfigurasi API_URL.';

    return;
  }

  await startScanner();
});


/************************************************
 * ELEMEN HTML
 ************************************************/

function $(id) {
  return document.getElementById(id);
}


/************************************************
 * MENYALAKAN KAMERA BELAKANG
 ************************************************/

async function startScanner() {

  try {
    $('status').textContent =
      'Meminta izin kamera...';

    $('result').className = 'result';

    $('nextButton').classList.add('hidden');
    $('stopButton').classList.remove('hidden');

    if (!window.Html5Qrcode) {
      throw new Error(
        'Library scanner QR gagal dimuat.'
      );
    }

    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 12,
        qrbox: function(width, height) {
          const size = Math.floor(
            Math.min(width, height) * 0.72
          );

          return {
            width: size,
            height: size
          };
        },
        aspectRatio: 1
      },
      async function(decodedText) {
        await onScan(decodedText);
      },
      function() {}
    );

    scannerRunning = true;
    scanLocked = false;

    $('status').textContent =
      'Kamera aktif. Silakan pindai QR Code.';

  } catch (error) {
    scannerRunning = false;

    showResult(
      'Kamera gagal dibuka: ' + error.message,
      false
    );

    $('status').textContent =
      'Periksa izin kamera pada browser HP.';
  }
}


/************************************************
 * MEMBACA QR CODE
 ************************************************/

async function onScan(decodedText) {

  if (scanLocked) return;

  scanLocked = true;

  const qr = String(decodedText || '').trim();

  if (!qr) {
    scanLocked = false;
    return;
  }

  $('status').textContent =
    'QR Code terbaca. Mengirim data ke server...';

  await stopCameraOnly();

  try {
    const response = await sendToAppsScript(qr);

    if (
      response &&
      response.success &&
      response.result &&
      response.result.success
    ) {
      const record = response.result.record || {};

      showResult(
        '<strong>ABSENSI BERHASIL!</strong>' +
        'Nama: ' + safe(record.Nama) + '<br>' +
        'NIS/NIP: ' + safe(record['ID/NIS/NIP']) + '<br>' +
        'Peran: ' + safe(record.Peran) + '<br>' +
        'Kelas/Jabatan: ' + safe(record['Kelas / Jabatan']) + '<br>' +
        'Tanggal: ' + safe(record.Tanggal) + '<br>' +
        'Waktu: ' + safe(record['Waktu Masuk']) + '<br>' +
        'Status: ' + safe(record.Status),
        true
      );

      $('status').textContent =
        'Data berhasil disimpan ke Google Spreadsheet.';

    } else {
      const message =
        response && response.result
          ? response.result.message
          : 'Data gagal disimpan.';

      showResult(
        '<strong>ABSENSI GAGAL!</strong>' +
        safe(message),
        false
      );

      $('status').textContent =
        'Silakan periksa QR Code atau coba kembali.';
    }

  } catch (error) {
    showResult(
      '<strong>KONEKSI GAGAL!</strong>' +
      safe(error.message),
      false
    );

    $('status').textContent =
      'Server tidak memberikan respons.';
  }

  $('nextButton').classList.remove('hidden');
}


/************************************************
 * KIRIM HASIL SCAN KE APPS SCRIPT
 ************************************************/

function sendToAppsScript(qr) {

  return new Promise(function(resolve, reject) {

    if (pendingRequest) {
      reject(
        new Error('Masih ada permintaan yang diproses.')
      );
      return;
    }

    const requestId =
      Date.now().toString() +
      Math.random().toString(36).substring(2);

    pendingRequest = {
      requestId: requestId,
      resolve: resolve,
      reject: reject
    };

    const payload = {
      action: 'scan',
      requestId: requestId,
      token: appToken,
      qr: qr
    };

    $('apiPayload').value =
      JSON.stringify(payload);

    $('apiForm').action = API_URL;

    $('apiForm').submit();

    setTimeout(function() {
      if (
        pendingRequest &&
        pendingRequest.requestId === requestId
      ) {
        pendingRequest = null;

        reject(
          new Error(
            'Waktu koneksi habis. Periksa URL Apps Script dan deployment.'
          )
        );
      }
    }, 30000);

  });
}


/************************************************
 * MENERIMA RESPONS APPS SCRIPT
 ************************************************/

window.addEventListener('message', function(event) {

  const frame = $('apiFrame');

  if (event.source !== frame.contentWindow) {
    return;
  }

  const data = event.data;

  if (
    !data ||
    !pendingRequest ||
    data.requestId !== pendingRequest.requestId
  ) {
    return;
  }

  const request = pendingRequest;

  pendingRequest = null;

  request.resolve(data);
});


/************************************************
 * TAMPILKAN HASIL SCAN
 ************************************************/

function showResult(message, success) {
  const element = $('result');

  element.className = success
    ? 'result success'
    : 'result error';

  element.innerHTML = message;
}


/************************************************
 * SCAN BERIKUTNYA
 ************************************************/

async function restartScanner() {

  $('result').className = 'result';

  $('nextButton').classList.add('hidden');

  scanLocked = false;

  await startScanner();
}


/************************************************
 * MATIKAN KAMERA
 ************************************************/

async function stopCameraOnly() {

  if (scanner && scannerRunning) {
    try {
      await scanner.stop();
    } catch (error) {}
  }

  scannerRunning = false;
}


async function stopScanner() {

  await stopCameraOnly();

  $('status').textContent =
    'Kamera berhasil ditutup.';

  $('stopButton').classList.add('hidden');
  $('nextButton').classList.remove('hidden');
}


/************************************************
 * KEMBALI KE APLIKASI UTAMA
 ************************************************/

function backToMain() {
  window.location.href = MAIN_URL;
}


/************************************************
 * AMANKAN TEKS
 ************************************************/

function safe(value) {
  return String(value || '').replace(
    /[&<>"']/g,
    function(char) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char];
    }
  );
}


/************************************************
 * TUTUP KAMERA SAAT HALAMAN DITINGGALKAN
 ************************************************/

window.addEventListener(
  'pagehide',
  function() {
    stopCameraOnly();
  }
);

</script>

</body>
</html>
